<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - UAV Detector</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <nav style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h1 style="margin:0">Uploads Dashboard</h1>
        <div>
          <a class="nav-link" href="/">Home</a>
        </div>
      </nav>
      <table class="uploads-table">
        <thead><tr><th>Preview</th><th>Filename</th><th>Detected</th><th>Feedback</th><th>Actions</th></tr></thead>
        <tbody>
        {% for u in uploads %}
          <tr>
            <td><img src="{{ url_for('processed_file', filename=u.processed_path) }}" style="height:80px" /></td>
            <td>{{ u.filename }}</td>
            <td>{{ 'Yes' if u.detected else 'No' }}</td>
            <td>{% if u.feedback is none %}Unlabeled{% elif u.feedback==1 %}UAV{% else %}Not UAV{% endif %}</td>
            <td>
              <form action="/feedback" method="post" style="display:inline">
                <input type="hidden" name="uid" value="{{ u.id }}" />
                <button name="is_uav" value="yes">Mark UAV</button>
              </form>
              <form action="/feedback" method="post" style="display:inline">
                <input type="hidden" name="uid" value="{{ u.id }}" />
                <button name="is_uav" value="no">Mark Not UAV</button>
              </form>
            </td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
  </html>
